<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booth Finder — ElectionGuide Pro</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
  <nav class="navbar scrolled">
    <div class="container nav-inner">
      <a href="/" class="nav-logo">
        <div class="logo-icon"><span class="material-symbols-outlined" style="color:white;">how_to_vote</span></div> 
        ElectionGuide
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/register.html">Register</a></li>
        <li><a href="/booth-finder.html" class="active">Booth Finder</a></li>
        <li><a href="/vote.html">Vote Simulator</a></li>
        <li><a href="/quiz.html">Awareness Quiz</a></li>
      </ul>
    </div>
  </nav>

  <main style="padding-top:120px;">
    <section class="section">
      <div class="container">
        <div style="text-align:center; margin-bottom:40px;">
          <span class="section-label">Location Services</span>
          <h1 style="font-size:3rem; margin-top:8px;">Find Your <span class="gradient-text">Polling Booth</span></h1>
          <p style="color:var(--text-secondary);">Locate your nearest polling station using Google Maps API.</p>
        </div>

        <div class="glass-card" style="padding: 20px;">
          <div style="display:flex; gap:12px; margin-bottom:20px;">
             <input type="text" id="booth-input" placeholder="Enter your Pincode (e.g. 110001, 400001)" style="flex:1; padding:14px; background:var(--bg-card); border:1px solid var(--border-glass); border-radius:10px; color:white;">
             <button class="btn btn-primary" id="search-booth-btn">Search</button>
          </div>
          <div id="map" style="height:500px; background:rgba(0,0,0,0.4); border-radius:10px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; border:1px solid var(--border-glass);">
             <img src="map-asset.png" alt="Electoral Booth Map" style="width:100%; height:100%; object-fit:cover; opacity:0.8;">
             <div id="booth-result-panel" style="position:absolute; background:var(--bg-glass); backdrop-filter:blur(20px); padding:20px; border-radius:16px; border:1px solid var(--border-glass); box-shadow: var(--shadow-glow); display:none;">
                <div style="display:flex; align-items:center; gap:12px;">
                  <span class="material-symbols-outlined" style="font-size:32px; color:var(--accent-1);">location_on</span>
                  <div>
                    <p id="booth-name" style="font-weight:700; color:white;"></p>
                    <p id="booth-address" style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;"></p>
                  </div>
                </div>
             </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="assistant.js"></script>
  <script src="booth-finder.js"></script>
</body>
</html>
