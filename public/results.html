<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Election Results — ElectionGuide Pro</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>
  <nav class="navbar scrolled">
    <div class="container nav-inner">
      <a href="/" class="nav-logo">
        <div class="logo-icon"><span class="material-symbols-outlined" style="color:white;">how_to_vote</span></div> 
        ElectionGuide
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/register.html">Register</a></li>
        <li><a href="/booth-finder.html">Booth Finder</a></li>
        <li><a href="/vote.html">Vote Simulator</a></li>
        <li><a href="/quiz.html">Awareness Quiz</a></li>
      </ul>
    </div>
  </nav>

  <main style="padding-top:120px;">
    <section class="section">
      <div class="container">
        <div style="text-align:center; margin-bottom:40px;">
          <span class="section-label">Real-time Data</span>
          <h1 style="font-size:3rem; margin-top:8px;">Electoral <span class="gradient-text">Insights</span></h1>
          <p style="color:var(--text-secondary);">Visualizing the pulse of the nation with advanced Google Charts analytics.</p>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:32px;">
          <div class="glass-card">
            <h3>Vote Distribution</h3>
            <div id="voteChart" style="height: 300px; margin-top:20px;"></div>
          </div>
          <div class="glass-card">
            <h3>Voter Turnout by Age</h3>
            <div id="turnoutChart" style="height: 300px; margin-top:20px;"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(drawCharts);

    function drawCharts() {
      // Pie Chart
      const data1 = google.visualization.arrayToDataTable([
        ['Party', 'Votes'],
        ['Party A', 45],
        ['Party B', 30],
        ['Party C', 15],
        ['Others', 10]
      ]);

      const options1 = {
        pieHole: 0.4,
        backgroundColor: 'transparent',
        legend: { position: 'bottom', textStyle: { color: 'white' } },
        colors: ['#818cf8', '#c084fc', '#fbbf24', '#22d3ee'],
        chartArea: { width: '100%', height: '80%' }
      };

      const chart1 = new google.visualization.PieChart(document.getElementById('voteChart'));
      chart1.draw(data1, options1);

      // Bar Chart
      const data2 = google.visualization.arrayToDataTable([
        ['Age Group', 'Turnout %', { role: 'style' }],
        ['18-25', 65, '#818cf8'],
        ['26-35', 78, '#818cf8'],
        ['36-50', 82, '#818cf8'],
        ['50+', 70, '#818cf8']
      ]);

      const options2 = {
        backgroundColor: 'transparent',
        legend: { position: 'none' },
        vAxis: { 
          minValue: 0, 
          textStyle: { color: 'white' },
          gridlines: { color: 'rgba(255,255,255,0.1)' }
        },
        hAxis: { 
          textStyle: { color: 'white' },
          gridlines: { color: 'transparent' }
        },
        chartArea: { width: '80%', height: '70%' }
      };

      const chart2 = new google.visualization.ColumnChart(document.getElementById('turnoutChart'));
      chart2.draw(data2, options2);
    }
  </script>
</body>
</html>
