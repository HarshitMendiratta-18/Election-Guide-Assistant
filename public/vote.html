<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVM Simulator — ElectionGuide Pro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <nav class="navbar scrolled">
    <div class="container nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon"><i data-lucide="vote" style="color:white;"></i></span> ElectionGuide
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/register.html">Register</a></li>
        <li><a href="/booth-finder.html">Booth Finder</a></li>
        <li><a href="/vote.html" class="active">Vote</a></li>
        <li><a href="/quiz.html">Quiz</a></li>
      </ul>
    </div>
  </nav>

  <main style="padding-top:120px;">
    <section class="section">
      <div class="container" style="max-width:800px;">
        <div style="text-align:center; margin-bottom:40px;">
          <span class="gradient-text" style="font-weight:800; text-transform:uppercase; letter-spacing:2px;">Digital Simulation</span>
          <h1 style="font-size:3rem; margin-top:8px;">Electronic Voting <span class="gradient-text">Machine</span></h1>
          <p style="color:var(--text-secondary); margin-top:12px;">Experience the 7-step process of casting a valid vote in the Indian General Elections.</p>
        </div>

        <div id="vote-container" class="glass-card" style="min-height:500px; display:flex; align-items:center; justify-content:center; flex-direction:column;">
          <i data-lucide="shield-check" style="width:64px; height:64px; color:var(--accent-1); margin-bottom:24px;"></i>
          <h3>Identity Verification</h3>
          <p style="color:var(--text-secondary); margin-bottom:32px;">Please enter your Voter ID to begin the simulation.</p>
          <div style="width:100%; max-width:400px;">
            <input type="text" id="voter-id-input" placeholder="Voter ID Number" style="width:100%; padding:16px; background:rgba(255,255,255,0.05); border:1px solid var(--border-glass); border-radius:12px; color:white; font-size:1.1rem; margin-bottom:16px;">
            <button class="btn btn-primary" style="width:100%; justify-content:center;" id="start-simulation-btn">Begin Simulation</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="vote.js"></script>
</body>
</html>
